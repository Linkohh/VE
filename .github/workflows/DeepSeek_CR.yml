name: DeepSeek Code Review

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deepseek:
    runs-on: ubuntu-latest
    steps:
      - name: DeepSeek Code Review via OpenRouter
        uses: hustcer/deepseek-review@v1
        with:
          # Your OpenRouter API key, stored in GitHub Secrets
          chat-token: ${{ secrets.OPENROUTER_API_KEY }}

          # The base URL for OpenRouter
          base-url: "https://openrouter.ai/api/v1"

          # The specific free model you found
          model: "deepseek/deepseek-chat-v3.1:free"
