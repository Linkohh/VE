# This is a basic workflow to help you get started with the DeepSeek Code Review Action

name: DeepSeek Code Review

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "deepseek"
  deepseek:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Runs the DeepSeek Code Review action
      - name: DeepSeek Code Review
        uses: hustcer/deepseek-review@v1
        with:
          # This is the secret token for the DeepSeek API
          chat-token: ${{ secrets.CHAT_TOKEN }}
